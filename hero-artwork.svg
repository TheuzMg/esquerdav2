<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180507" />
      <stop offset="40%" stop-color="#2a080c" />
      <stop offset="70%" stop-color="#3d0d12" />
      <stop offset="100%" stop-color="#0f0204" />
    </linearGradient>
    <linearGradient id="redGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#dc2626" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#gridPattern)" />

  <!-- Radial highlight -->
  <circle cx="600" cy="200" r="450" fill="#dc2626" opacity="0.18" filter="blur(60px)" />
  <circle cx="200" cy="450" r="300" fill="#991b1b" opacity="0.15" filter="blur(50px)" />

  <!-- Stylized Sun of Equality & Rays -->
  <g opacity="0.25">
    <circle cx="600" cy="280" r="140" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,6" />
    <circle cx="600" cy="280" r="210" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="10,8" />
    <line x1="600" y1="40" x2="600" y2="520" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />
    <line x1="360" y1="280" x2="840" y2="280" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.3" />
    <line x1="430" y1="110" x2="770" y2="450" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3" />
    <line x1="770" y1="110" x2="430" y2="450" stroke="#ef4444" stroke-width="1" stroke-opacity="0.3" />
  </g>

  <!-- Historic French Revolution & Social Struggle Silhouettes -->
  <!-- Background crowd and flags -->
  <g fill="#120204" opacity="0.85">
    <!-- Skyline & Bastille silhouette -->
    <path d="M0,450 L70,440 L90,410 L130,410 L140,445 L220,440 L260,380 L310,380 L320,440 L450,435 L500,390 L530,390 L550,440 L700,430 L730,370 L780,370 L800,435 L920,440 L960,395 L1020,395 L1050,445 L1200,440 L1200,630 L0,630 Z" />
  </g>

  <!-- Midground silhouettes: Marching people, banners, raised hands -->
  <g fill="#200609" opacity="0.95">
    <path d="M0,500 Q150,480 300,490 T600,480 T900,495 T1200,485 L1200,630 L0,630 Z" />
  </g>

  <!-- Dynamic historical banner / flag floating across -->
  <path d="M 380,240 C 480,200 540,270 660,220 C 740,185 820,230 880,205 L 860,340 C 800,360 720,320 640,350 C 530,390 460,320 370,355 Z" fill="#b91c1c" opacity="0.4" />
  <path d="M 400,260 C 490,225 550,285 650,245 C 720,215 790,250 840,230 L 825,325 C 775,345 710,310 640,335 C 545,370 480,310 395,335 Z" fill="#dc2626" opacity="0.6" />

  <!-- Foreground Figures: People united, banners, book, gears of industry -->
  <g fill="#0a0203">
    <!-- Person holding torch of knowledge & liberty on left -->
    <path d="M 280,420 C 275,400 285,385 295,385 C 305,385 315,400 310,420 C 315,440 330,470 340,510 L 260,510 C 270,470 280,440 280,420 Z" />
    <path d="M 290,410 L 260,330 L 275,325 L 300,405 Z" />
    <!-- Torch Flame -->
    <path d="M 255,330 C 240,300 260,270 255,250 C 275,270 285,290 270,330 Z" fill="#f59e0b" />
    <path d="M 258,320 C 250,305 260,285 258,275 C 268,285 272,300 264,320 Z" fill="#ef4444" />

    <!-- Central figure holding high a banner of rights -->
    <circle cx="600" cy="350" r="28" />
    <path d="M 575,380 C 585,375 615,375 625,380 L 645,510 L 555,510 Z" />
    <!-- Arms raised in solidarity -->
    <path d="M 580,390 L 530,310 L 545,300 L 595,380 Z" />
    <path d="M 620,390 L 670,310 L 655,300 L 605,380 Z" />
    <line x1="520" y1="210" x2="540" y2="340" stroke="#f59e0b" stroke-width="5" />
    <!-- Banner on pole -->
    <path d="M 520,210 C 580,195 620,225 680,205 L 675,270 C 615,290 580,260 522,275 Z" fill="#dc2626" />

    <!-- Crowd silhouettes across the base -->
    <path d="M 0,550 C 50,530 100,540 160,535 C 210,530 250,545 310,540 C 370,535 420,545 480,538 C 540,530 600,545 660,538 C 720,530 780,545 840,536 C 900,528 960,542 1020,538 C 1080,534 1140,545 1200,540 L 1200,630 L 0,630 Z" />

    <!-- Distinct heads and raised fists along the crowd -->
    <circle cx="120" cy="515" r="16" />
    <circle cx="180" cy="510" r="18" />
    <circle cx="230" cy="520" r="15" />
    <circle cx="370" cy="510" r="17" />
    <circle cx="430" cy="505" r="18" />
    <circle cx="490" cy="512" r="16" />
    <circle cx="710" cy="510" r="17" />
    <circle cx="770" cy="505" r="19" />
    <circle cx="830" cy="515" r="16" />
    <circle cx="890" cy="508" r="18" />
    <circle cx="950" cy="512" r="17" />
    <circle cx="1010" cy="508" r="16" />
    <circle cx="1080" cy="515" r="18" />

    <!-- Raised fists of labor & emancipation -->
    <path d="M 180,480 L 180,440 L 195,440 L 195,480 Z" />
    <rect x="175" y="425" width="25" height="20" rx="6" />

    <path d="M 430,475 L 430,435 L 445,435 L 445,475 Z" />
    <rect x="425" y="420" width="25" height="20" rx="6" />

    <path d="M 770,475 L 770,430 L 785,430 L 785,475 Z" />
    <rect x="765" y="415" width="25" height="20" rx="6" />

    <path d="M 950,480 L 950,440 L 965,440 L 965,480 Z" />
    <rect x="945" y="425" width="25" height="20" rx="6" />
  </g>

  <!-- Typography overlay / decorative elements -->
  <g font-family="serif" font-weight="bold" fill="#ffffff" opacity="0.9">
    <text x="60" y="90" font-size="14" letter-spacing="4" fill="#f59e0b" font-family="sans-serif">MEMÓRIA HISTÓRICA &amp; CIÊNCIAS HUMANAS</text>
    <text x="60" y="130" font-size="28" letter-spacing="2">1789 — 2026: A JORNADA DA EMANCIPAÇÃO SOCIAL</text>
  </g>

  <!-- Quote badge -->
  <g transform="translate(820, 70)">
    <rect width="320" height="90" rx="8" fill="#180507" fill-opacity="0.85" stroke="#b91c1c" stroke-width="1.5" />
    <text x="20" y="32" font-size="12" fill="#f59e0b" font-family="sans-serif" font-weight="bold" letter-spacing="1">PRINCÍPIO HISTÓRICO</text>
    <text x="20" y="55" font-size="13" fill="#f3f4f6" font-family="serif" font-style="italic">"Os homens nascem e são livres</text>
    <text x="20" y="73" font-size="13" fill="#f3f4f6" font-family="serif" font-style="italic">e iguais em direitos." (1789)</text>
  </g>

  <!-- Gradient shadow at bottom -->
  <rect y="570" width="1200" height="60" fill="url(#bgGrad)" opacity="0.9" />
</svg>
