<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
  </defs>
  <!-- Modern Emblem: Equality symbol inside a shield of human dignity -->
  <circle cx="250" cy="250" r="230" fill="#180507" stroke="#dc2626" stroke-width="6" />
  <circle cx="250" cy="250" r="215" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8,6" />
  
  <!-- Stylized Torch of Knowledge and Freedom -->
  <path d="M 235,380 L 265,380 L 260,260 L 240,260 Z" fill="#450a0a" stroke="#f59e0b" stroke-width="3" />
  
  <!-- Equality Bars (=) shining bright -->
  <rect x="170" y="210" width="160" height="26" rx="6" fill="#f59e0b" />
  <rect x="170" y="255" width="160" height="26" rx="6" fill="#dc2626" />
  
  <!-- Flame of Solidarity and Justice -->
  <path d="M 250,110 C 220,150 210,180 250,205 C 290,180 280,150 250,110 Z" fill="#ef4444" />
  <path d="M 250,135 C 235,160 230,175 250,195 C 270,175 265,160 250,135 Z" fill="#fbbf24" />
  
  <!-- Surrounding Laurel wreath leaves of peace and rights -->
  <g fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round">
    <path d="M 120,320 C 90,260 90,190 140,140" />
    <path d="M 380,320 C 410,260 410,190 360,140" />
    <!-- Leaf nodes left -->
    <circle cx="105" cy="280" r="6" fill="#f59e0b" />
    <circle cx="95" cy="230" r="6" fill="#f59e0b" />
    <circle cx="105" cy="180" r="6" fill="#f59e0b" />
    <circle cx="130" cy="145" r="6" fill="#f59e0b" />
    <!-- Leaf nodes right -->
    <circle cx="395" cy="280" r="6" fill="#f59e0b" />
    <circle cx="405" cy="230" r="6" fill="#f59e0b" />
    <circle cx="395" cy="180" r="6" fill="#f59e0b" />
    <circle cx="370" cy="145" r="6" fill="#f59e0b" />
  </g>
  
  <!-- Outer Arch Text without invalid entities -->
  <text x="250" y="440" font-family="'Cinzel', 'Merriweather', serif" font-size="19" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="4">IGUALDADE • JUSTIÇA • CIDADANIA</text>
</svg>
