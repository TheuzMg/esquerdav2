<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140a0b" />
      <stop offset="50%" stop-color="#230d10" />
      <stop offset="100%" stop-color="#0a0506" />
    </linearGradient>
    <linearGradient id="brAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <rect width="1000" height="500" fill="url(#brBg)" />

  <!-- Subdued Brazilian flag diamond and circle in background -->
  <g opacity="0.12">
    <polygon points="500,40 920,250 500,460 80,250" fill="none" stroke="#f59e0b" stroke-width="4" />
    <circle cx="500" cy="250" r="140" fill="none" stroke="#3b82f6" stroke-width="3" />
  </g>

  <!-- Dramatic historical elements -->
  <!-- 1. Greves operárias 1917 / Fábricas -->
  <g transform="translate(60, 160)" fill="#1c0709" stroke="#991b1b" stroke-width="1.5">
    <!-- Factory Chimneys -->
    <rect x="20" y="80" width="70" height="180" rx="3" />
    <rect x="110" y="50" width="55" height="210" rx="3" />
    <polygon points="40,80 55,20 70,80" />
    <polygon points="125,50 137,10 150,50" />
    <!-- Smoke of 1917 industrial strike -->
    <path d="M55,20 C40,-10 80,-30 65,-60" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" opacity="0.4" />
    <path d="M137,10 C120,-20 160,-40 145,-70" fill="none" stroke="#6b7280" stroke-width="4" stroke-linecap="round" opacity="0.4" />
  </g>

  <!-- 2. The 1988 Constitution Book in Center -->
  <g transform="translate(420, 120)">
    <!-- Glow -->
    <circle cx="80" cy="120" r="130" fill="#dc2626" opacity="0.25" filter="blur(30px)" />

    <!-- Open book representing Constituição Cidadã de 1988 -->
    <path d="M80,210 L10,180 L10,60 L80,90 Z" fill="#2d0a0e" stroke="#f59e0b" stroke-width="2.5" />
    <path d="M80,210 L150,180 L150,60 L80,90 Z" fill="#3a0d12" stroke="#f59e0b" stroke-width="2.5" />
    <!-- Spine -->
    <line x1="80" y1="90" x2="80" y2="210" stroke="#f59e0b" stroke-width="3" />
    <!-- Pages lines -->
    <line x1="25" y1="85" x2="68" y2="102" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="25" y1="110" x2="68" y2="127" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="25" y1="135" x2="68" y2="152" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="25" y1="160" x2="68" y2="177" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />

    <line x1="92" y1="102" x2="135" y2="85" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="92" y1="127" x2="135" y2="110" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="92" y1="152" x2="135" y2="135" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />
    <line x1="92" y1="177" x2="135" y2="160" stroke="#ffffff" stroke-width="1.5" opacity="0.5" />

    <!-- Text on Book -->
    <text x="45" y="70" font-family="serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">CONSTITUIÇÃO</text>
    <text x="115" y="70" font-family="serif" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">CIDADÃ 1988</text>
  </g>

  <!-- 3. Diretas Já & Popular Movement on Right -->
  <g transform="translate(680, 160)" fill="#1c0709" stroke="#b91c1c" stroke-width="1.5">
    <!-- Multitude with banners -->
    <path d="M20,240 L20,130 C40,110 60,110 80,130 L80,240 Z" />
    <path d="M90,240 L90,90 C115,70 140,70 165,90 L165,240 Z" />
    <path d="M175,240 L175,120 C195,100 220,100 240,120 L240,240 Z" />

    <!-- Big Banner "DIRETAS JÁ & DEMOCRACIA" -->
    <line x1="50" y1="140" x2="50" y2="30" stroke="#f59e0b" stroke-width="3" />
    <line x1="210" y1="140" x2="210" y2="30" stroke="#f59e0b" stroke-width="3" />
    <rect x="50" y="30" width="160" height="45" rx="4" fill="#991b1b" stroke="#f59e0b" stroke-width="2" />
    <text x="130" y="58" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">DIRETAS JÁ!</text>
  </g>

  <!-- Horizon Line of Solidary Hands -->
  <path d="M0,420 Q250,400 500,410 T1000,400 L1000,500 L0,500 Z" fill="#110405" />

  <!-- Milestones Text Badges at Bottom -->
  <g font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">
    <g transform="translate(80, 440)">
      <circle cx="8" cy="8" r="5" fill="#dc2626" />
      <text x="22" y="12" fill="#e5e7eb">1917: Greve Geral</text>
    </g>
    <g transform="translate(290, 440)">
      <circle cx="8" cy="8" r="5" fill="#f59e0b" />
      <text x="22" y="12" fill="#e5e7eb">1943: Conquista da CLT</text>
    </g>
    <g transform="translate(520, 440)">
      <circle cx="8" cy="8" r="5" fill="#ef4444" />
      <text x="22" y="12" fill="#e5e7eb">1984: Diretas Já &amp; Redemocratização</text>
    </g>
    <g transform="translate(790, 440)">
      <circle cx="8" cy="8" r="5" fill="#10b981" />
      <text x="22" y="12" fill="#e5e7eb">1988: SUS &amp; Seguridade Social</text>
    </g>
  </g>
</svg>
